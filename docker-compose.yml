services:
  starconverge:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_PATH: /data/starconverge.db
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_JWT_SECRET: change-me-in-production
      CORS_ORIGIN: "*"
    volumes:
      - sc-data:/data
    restart: unless-stopped

volumes:
  sc-data:
