services:
  starconverge:
    image: crpi-h49so3m1b8wov228.cn-hangzhou.personal.cr.aliyuncs.com/yxl_image_registry/starconverge:v1.0.0
    pull_policy: missing
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_PATH: /data/starconverge.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EPAY_API_URL: ${EPAY_API_URL:-}
      EPAY_PID: ${EPAY_PID:-}
      EPAY_KEY: ${EPAY_KEY:-}
      EPAY_CNY_PER_USD: ${EPAY_CNY_PER_USD:-7.2}
      EPAY_TYPES: ${EPAY_TYPES:-alipay,wxpay}
    volumes:
      - sc-data:/data
    restart: unless-stopped

volumes:
  sc-data:
