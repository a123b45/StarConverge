services:
  starconverge:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: starconverge
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_PATH: /data/starconverge.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - sc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sc-data:
